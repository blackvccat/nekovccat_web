<svg width="1360" height="800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" role="img" aria-label="Nekoweb 生产业务架构图">
  <rect width="100%" height="100%" fill="#fffdf8"/>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b76"/>
          </marker>
          <marker id="arrowGo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e7490"/>
          </marker>
          <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
          </marker>
          <marker id="arrowModel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
          </marker>
          <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
          </marker>
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#362e20" flood-opacity="0.10"/>
          </filter>
          <style>
            .lane-label { font: 800 12px -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; letter-spacing: .08em; fill: #7a6f5e; text-transform: uppercase; }
            .box-title { font: 800 15px -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill: #17202a; }
            .box-text { font: 500 11.5px -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill: #5f6b76; }
            .box-small { font: 500 10.5px -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill: #6b6255; }
            .box-code { font: 700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill: #0e7490; }
            .box-code.purple { fill: #7c3aed; }
            .box-code.orange { fill: #c2410c; }
            .box-code.amber { fill: #b45309; }
            .arrow-label { font: 700 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill: #5f6b76; }
            .asset-title { font: 800 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill: #17202a; }
            .note { font: 600 10.5px -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill: #8a5a12; }
          </style>
        </defs>

        <!-- production lane labels -->
        <text class="lane-label" x="40" y="60">Browser</text>
        <text class="lane-label" x="220" y="60">Edge</text>
        <text class="lane-label" x="370" y="60">Next.js BFF</text>
        <text class="lane-label" x="600" y="60">Go control plane · :8011</text>
        <text class="lane-label" x="970" y="60">dsh · Node runtime</text>
        <text class="lane-label" x="1200" y="60">DeepSeek</text>

        <!-- browser -->
        <g filter="url(#softShadow)">
          <rect x="40" y="150" width="150" height="130" rx="18" fill="#fffdf8" stroke="#d9d2c3"/>
          <text class="box-title" x="115" y="184" text-anchor="middle">浏览器</text>
          <text class="box-text" x="115" y="206" text-anchor="middle">Home / My World</text>
          <text class="box-text" x="115" y="225" text-anchor="middle">站内助手</text>
          <text class="box-code" x="115" y="254" text-anchor="middle">fetch + SSE</text>
        </g>

        <!-- edge -->
        <g filter="url(#softShadow)">
          <rect x="220" y="150" width="110" height="130" rx="18" fill="#fffdf8" stroke="#d9d2c3"/>
          <text class="box-title" x="275" y="184" text-anchor="middle">Cloudflare</text>
          <text class="box-text" x="275" y="206" text-anchor="middle">HTTPS / Tunnel</text>
          <text class="box-code" x="275" y="234" text-anchor="middle">neko.origin.kim</text>
        </g>

        <!-- next -->
        <g filter="url(#softShadow)">
          <rect x="360" y="130" width="190" height="170" rx="18" fill="#fffdf8" stroke="#d9d2c3"/>
          <text class="box-title" x="455" y="163" text-anchor="middle">Next.js 服务端</text>
          <text class="box-text" x="455" y="185" text-anchor="middle">签名会话 / CSRF</text>
          <text class="box-text" x="455" y="204" text-anchor="middle">同源校验 / 关系 Cookie</text>
          <text class="box-text" x="455" y="223" text-anchor="middle">客户端 IP 规范化</text>
          <rect x="380" y="242" width="150" height="38" rx="10" fill="#f7f5ee" stroke="#e5ded0"/>
          <text class="box-code" x="455" y="266" text-anchor="middle">/api/chat 代理</text>
        </g>

        <!-- go -->
        <g filter="url(#softShadow)">
          <rect x="580" y="96" width="340" height="360" rx="22" fill="#f8fdfe" stroke="#b9e3ea"/>
          <text class="box-title" x="750" y="126" text-anchor="middle">Go 后端（systemd · 127.0.0.1:8011）</text>
          <rect x="600" y="144" width="300" height="52" rx="11" fill="#fffdf8" stroke="#cfe9ee"/>
          <text class="box-code" x="614" y="165">internal/api</text>
          <text class="box-text" x="614" y="184">HTTP · SSE · request ID · 错误映射</text>
          <rect x="600" y="206" width="146" height="70" rx="11" fill="#fffdf8" stroke="#cfe9ee"/>
          <text class="box-code" x="614" y="227">internal/admission</text>
          <text class="box-small" x="614" y="246">FIFO · 突发冷却</text>
          <text class="box-small" x="614" y="262">Redis 全局槽 + 滚动配额</text>
          <rect x="754" y="206" width="146" height="70" rx="11" fill="#fffdf8" stroke="#cfe9ee"/>
          <text class="box-code" x="768" y="227">internal/visitor</text>
          <text class="box-small" x="768" y="246">登录 · 应用 · 授权</text>
          <text class="box-small" x="768" y="262">data / files</text>
          <rect x="600" y="286" width="300" height="58" rx="11" fill="#fffdf8" stroke="#cfe9ee"/>
          <text class="box-code" x="614" y="307">internal/agent</text>
          <text class="box-text" x="614" y="326">Service · Manager · 渐进回复 · 脱敏</text>
          <rect x="600" y="354" width="300" height="58" rx="11" fill="#fffdf8" stroke="#cfe9ee"/>
          <text class="box-code" x="614" y="375">internal/harness</text>
          <text class="box-text" x="614" y="394">stdio JSON-RPC · 进程组 · 超时回收</text>
          <rect x="600" y="424" width="300" height="18" rx="9" fill="#e0f2f6"/>
          <text class="box-code" x="750" y="437" text-anchor="middle">one dsh process per request</text>
        </g>

        <!-- dsh -->
        <g filter="url(#softShadow)">
          <rect x="950" y="120" width="210" height="250" rx="20" fill="#fcfaff" stroke="#ddd0f7"/>
          <text class="box-title" x="1055" y="151" text-anchor="middle">dsh 单文件运行时</text>
          <text class="box-text" x="1055" y="172" text-anchor="middle">Node · sdk-minimal</text>
          <text class="box-text" x="1055" y="191" text-anchor="middle">模型循环 / 工具执行</text>
          <rect x="970" y="212" width="170" height="34" rx="9" fill="#f4edff" stroke="#e3d7fb"/>
          <text class="box-code purple" x="1055" y="233" text-anchor="middle">website.patch.yml</text>
          <rect x="970" y="254" width="170" height="34" rx="9" fill="#f4edff" stroke="#e3d7fb"/>
          <text class="box-code purple" x="1055" y="275" text-anchor="middle">website-tools.mjs</text>
          <rect x="970" y="296" width="170" height="42" rx="9" fill="#f4edff" stroke="#e3d7fb"/>
          <text class="box-code purple" x="1055" y="314" text-anchor="middle">progressive_bridge.mjs</text>
          <text class="box-small" x="1055" y="330" text-anchor="middle">site.assistant 通知</text>
        </g>

        <!-- model -->
        <g filter="url(#softShadow)">
          <rect x="1190" y="150" width="140" height="130" rx="18" fill="#f7faff" stroke="#cbdcff"/>
          <text class="box-title" x="1260" y="184" text-anchor="middle">DeepSeek</text>
          <text class="box-text" x="1260" y="206" text-anchor="middle">deepseek-v4-pro</text>
          <text class="box-text" x="1260" y="225" text-anchor="middle">模型循环 / 计费</text>
          <text class="box-code" x="1260" y="254" text-anchor="middle">HTTPS</text>
        </g>

        <!-- request path -->
        <line x1="190" y1="215" x2="216" y2="215" stroke="#5f6b76" stroke-width="1.8" marker-end="url(#arrow)"/>
        <text class="arrow-label" x="203" y="204" text-anchor="middle">HTTPS</text>
        <line x1="330" y1="215" x2="356" y2="215" stroke="#5f6b76" stroke-width="1.8" marker-end="url(#arrow)"/>
        <line x1="550" y1="215" x2="576" y2="215" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrowGo)"/>
        <text class="arrow-label" x="563" y="204" text-anchor="middle">proxy</text>
        <line x1="920" y1="215" x2="946" y2="215" stroke="#0e7490" stroke-width="2.4" marker-end="url(#arrowGo)"/>
        <line x1="946" y1="238" x2="920" y2="238" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowPurple)"/>
        <text class="arrow-label" x="933" y="204" text-anchor="middle">stdio</text>
        <text class="arrow-label" x="933" y="254" text-anchor="middle">events</text>
        <line x1="1160" y1="215" x2="1186" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowModel)"/>
        <line x1="1186" y1="238" x2="1160" y2="238" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowModel)"/>
        <text class="arrow-label" x="1173" y="204" text-anchor="middle">model</text>

        <!-- data stores -->
        <line x1="680" y1="456" x2="680" y2="492" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowData)"/>
        <text class="arrow-label" x="690" y="478">SQL</text>
        <line x1="850" y1="456" x2="850" y2="492" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowData)"/>
        <text class="arrow-label" x="860" y="478">quota</text>
        <line x1="900" y1="276" x2="1000" y2="492" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowData)"/>
        <text class="arrow-label" x="960" y="430">data/files</text>

        <g filter="url(#softShadow)">
          <rect x="580" y="495" width="200" height="82" rx="14" fill="#fffaf0" stroke="#ead7b4"/>
          <text class="box-title" x="680" y="522" text-anchor="middle">PostgreSQL 17</text>
          <text class="box-small" x="680" y="543" text-anchor="middle">visitor_accounts / app grants</text>
          <text class="box-small" x="680" y="560" text-anchor="middle">agent_conversations / agent_turns</text>
        </g>
        <g filter="url(#softShadow)">
          <rect x="800" y="495" width="180" height="82" rx="14" fill="#fffaf0" stroke="#ead7b4"/>
          <text class="box-title" x="890" y="522" text-anchor="middle">Redis 8</text>
          <text class="box-small" x="890" y="543" text-anchor="middle">滚动配额缓存</text>
          <text class="box-small" x="890" y="560" text-anchor="middle">全站 / 单 IP 窗口</text>
        </g>
        <g filter="url(#softShadow)">
          <rect x="1000" y="495" width="330" height="82" rx="14" fill="#fffaf0" stroke="#ead7b4"/>
          <text class="box-title" x="1165" y="522" text-anchor="middle">本地运营存储</text>
          <text class="box-small" x="1165" y="543" text-anchor="middle">visitor app data.sqlite · visitor files · login failures</text>
          <text class="box-small" x="1165" y="560" text-anchor="middle">按应用 / 访客隔离</text>
        </g>

        <!-- shared assets -->
        <g>
          <rect x="40" y="610" width="390" height="66" rx="14" fill="#fffdf8" stroke="#d9d2c3"/>
          <text class="asset-title" x="56" y="634">agent/website.patch.yml</text>
          <text class="box-small" x="56" y="652">禁用 shell / 文件 / 网络工具；Go 注入工具模块路径</text>
        </g>
        <g>
          <rect x="446" y="610" width="390" height="66" rx="14" fill="#fffdf8" stroke="#d9d2c3"/>
          <text class="asset-title" x="462" y="634">agent/website-tools.mjs</text>
          <text class="box-small" x="462" y="652">site_info / desktop_apps / girlfriend_mode</text>
        </g>
        <g>
          <rect x="852" y="610" width="478" height="66" rx="14" fill="#fffdf8" stroke="#d9d2c3"/>
          <text class="asset-title" x="868" y="634">DSH_HOME · relationship-private.json</text>
          <text class="box-small" x="868" y="652">运行时轨迹 / 私有问答与受保护内容，均在 release 外</text>
        </g>
        <!-- rollback + units -->
        <g>
          <rect x="40" y="705" width="610" height="52" rx="12" fill="#f7f5ee" stroke="#e5ded0" stroke-dasharray="5 4"/>
          <text class="asset-title" x="56" y="728">Python FastAPI（backend/）· 回滚 / 协议对照</text>
          <text class="box-small" x="56" y="746">生产链路不经过 Python；旧 systemd unit 已停止并 disable</text>
        </g>
        <g>
          <rect x="670" y="705" width="660" height="52" rx="12" fill="#f7f5ee" stroke="#e5ded0"/>
          <text class="asset-title" x="686" y="728">systemd：nekoweb-backend-go · nekoweb-frontend-go · nekoweb-tunnel</text>
          <text class="box-small" x="686" y="746">PostgreSQL / Redis 仅监听回环；Go 和 Next 只由隧道暴露前端</text>
        </g>
      </svg>
