# nginx 直接反代本站（不走 Cloudflare）：把下面的 location 粘进 example.com 的 443 server 块里
#
# 用宝塔面板管 nginx 的机器（路径是 /www/server/nginx 与 /www/server/panel/vhost/nginx/）不要照这个路径摆：
# location 放 /www/server/panel/vhost/nginx/extension/example.com/*.conf（vhost 里已经 include 了这个目录），
# 共用反代头放 /www/server/nginx/conf/marcusweb-proxy.conf 并用绝对路径 include。
#
# 两处前置：
# 1. 先把 deployment/nginx-marcusweb-proxy.conf 存成 /etc/nginx/snippets/marcusweb-proxy.conf；
# 2. 这些 location 放进你**现有**的那个 server 块（主站用的那个）、`location /` 之前，
#    `location /` 保持原样继续指向主站。改完 `sudo nginx -t` 再 `sudo systemctl reload nginx`。
#
# 另外三条：
# - 本站在 127.0.0.1:3010，只绑回环，外部无法直连；
# - /etc/marcusweb/frontend.env 里 SITE_ORIGIN=https://example.com（不能带 /terminal），
#   并开 TRUST_PROXY_IP=true、**关掉** TRUST_CLOUDFLARE（详见文件末尾的说明）；
# - 顺手检查 nginx.conf / conf.d 里有没有从 Cloudflare 时代留下的 `set_real_ip_from ...;` 与
#   `real_ip_header CF-Connecting-IP;`：没有 Cloudflare 在前面时，它会把 $remote_addr 变成
#   客户端能自己写的值，上面那条防线就白设了。删掉，或只对确实信任的代理网段保留。

# 桌面入口。查询串（?app=explorer&tab=about）不受影响。
# proxy_cache off 是必须的：宝塔的 /www/server/nginx/conf/proxy.conf 在 http 块里全局开了
# proxy_cache，而 Next 给预渲染页发的头是 `Cache-Control: s-maxage=31536000`，不关掉这里，
# 这一页的 HTML 会被缓存很久——换版本后浏览器拿到的仍是旧文档（旧的图标 hash、旧的 chunk 地址）。
# 宝塔/其他面板装出来的 nginx 都可能有这个全局缓存，所以每个 location 都显式表态。
location = /terminal {
    include snippets/marcusweb-proxy.conf;
    proxy_cache off;
}

# Next 的构建产物与图片优化端点。
# 用 ^~ 是为了不被同 server 块里可能存在的正则 location 抢走。
# 不要在这里统一加长缓存：Next 自己对 /_next/static/ 就发
# `Cache-Control: public, max-age=31536000, immutable`，而 /_next/image 要按需回源。
location ^~ /_next/ {
    include snippets/marcusweb-proxy.conf;
}

# 站点自己的图片、图标与字体。
location ^~ /images/ {
    include snippets/marcusweb-proxy.conf;
}

location ^~ /icons-svg/ {
    include snippets/marcusweb-proxy.conf;
}

location ^~ /fonts/ {
    include snippets/marcusweb-proxy.conf;
}

location = /favicon.ico {
    include snippets/marcusweb-proxy.conf;
    # 换图标时不要让代理层插在中间（应用发的 max-age=0, must-revalidate 本来就够，这里再明确一次）。
    proxy_cache off;
}

# 聊天：SSE 长连接，必须关缓冲，否则回答会被攒在 nginx 里不吐给浏览器。
# 后端单次请求最长 180 秒（DSH_REQUEST_TIMEOUT_SECONDS），读超时给 300s。
location ^~ /api/chat {
    include snippets/marcusweb-proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 访客模式：登录、应用列表、应用视图与私有素材（壁纸/图标都从这里出）。
# 这些响应应用层已经发 no-store / private, no-store，代理层再显式关一次：
# 万一将来漏写响应头，也绝不会有私有内容被缓存后发给别人。
location ^~ /api/visitor {
    include snippets/marcusweb-proxy.conf;
    proxy_cache off;
    proxy_read_timeout 60s;
}

# 网易云歌单转发：要后端能出网访问 music.163.com，拿不到时前端只是不显示曲目列表。
location ^~ /api/music {
    include snippets/marcusweb-proxy.conf;
    proxy_read_timeout 60s;
}

# 健康检查，给监控/自检用。
location = /api/health {
    include snippets/marcusweb-proxy.conf;
}

# 别写成一个 `location /api/`：主站如果也用 /api/，会被一把抢走，按前缀逐个列才不会打架。

# 可选：旧地址跳转。next.config.ts 里 /my-world、/about、/contact 会转到桌面栏目。
# 主站自己也要用这几个路径的话，就**不要**加下面三行，让它们继续归主站。
# location = /my-world { include snippets/marcusweb-proxy.conf; }
# location = /about    { include snippets/marcusweb-proxy.conf; }
# location = /contact  { include snippets/marcusweb-proxy.conf; }

# HTTP → HTTPS 跳转由 `certbot --nginx` 自动加；本站自己在 NODE_ENV=production 下会发 HSTS，
# 不用在这里再写一遍。

# ============================================================================
# 客户端身份（限流用）为什么必须走 nginx
# ============================================================================
# 聊天与访客登录按客户端地址分桶限流（访客登录 6 次/分钟 / 30 次/小时；聊天分两档：
# 匿名按签名设备 cookie 20 条/12 小时，同一出口地址上再压 100 条/12 小时的聚合上限；
# 登录访客按账号 100 条/12 小时。按地址的那一档兜底靠的就是下面这个 x-real-ip）。
# 这个地址由前端的 clientAddress() 决定，两种取值方式只能开一个：
#   TRUST_PROXY_IP=true      → 读上面 X-Real-IP 覆写过的值（本文件这套 nginx 入口用这个）
#   TRUST_CLOUDFLARE=true    → 读 CF-Connecting-IP（只有真在 Cloudflare 后面才用）
#   两个都不开                → 所有访客共用一个桶，登录窗口退化成全站窗口
# 没有 Cloudflare 却开了 TRUST_CLOUDFLARE，等于让客户端自己填 CF-Connecting-IP：
# 每次请求换个值就是新桶，按 IP 的限流形同不存在。
# 访客密码另有与 IP 无关的按访客名失败锁定（默认 10 次 / 15 分钟）。

# ============================================================================
# 改完怎么验（在服务器上）
# ============================================================================
# sudo nginx -t && sudo systemctl reload nginx
# curl -fsS https://example.com/api/health
# curl -fI  https://example.com/terminal
# curl -I  https://example.com/api/visitor/status                      # 必须 403
# curl -I  "https://example.com/api/visitor/app?app=our-space"         # 必须 403
# curl -fsS "https://example.com/api/music/playlist?id=3778678&limit=50"
# curl -sI https://example.com/ | head -5                              # / 还是主站
#
# 客户端身份自检：同一个 IP 连发 7 次访客登录，第 7 次应当 429；
# 换另一个 IP 应当还能试。若所有 IP 一起被限，说明 X-Real-IP 没传到（检查 include）。
