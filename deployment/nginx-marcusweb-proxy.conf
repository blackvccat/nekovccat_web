# 站内服务共用的反代头。存成 /etc/nginx/snippets/marcusweb-proxy.conf，
# 由 deployment/nginx-example.com.conf 里各个 location 用 include 引用。
#
# X-Real-IP 用 $remote_addr 覆写（不是透传客户端给的值）：frontend.env 里的
# TRUST_PROXY_IP 只读这个头，覆写保证客户端伪造它拿不到新的限流桶。
# 漏掉这一行，聊天与访客登录会一律 403。
proxy_pass http://127.0.0.1:3010;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "";
